<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GeriCall CareTaker Portal</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="favicon-180.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: #F7F7F7;
      color: #2D2D2D;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    #root { min-height: 100vh; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideInRight { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes scaleIn { from { opacity: 0; transform: scale(0.5); } to { opacity: 1; transform: scale(1); } }
    @keyframes toastIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes toastOut { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(20px); } }

    /* Dark mode */
    body.dark-mode { background: #1a1a1a !important; color: #e0e0e0 !important; }
    body.dark-mode div[style*="background: #FFFFFF"], body.dark-mode div[style*="background: rgb(255, 255, 255)"] { background: #2a2a2a !important; }
    body.dark-mode [style*="#F7F7F7"] { background: #1a1a1a !important; }
    body.dark-mode [style*="#E8E8E8"] { border-color: #3a3a3a !important; }
    body.dark-mode [style*="color: #2D2D2D"] { color: #e0e0e0 !important; }
    body.dark-mode [style*="color: #666666"] { color: #999 !important; }
    body.dark-mode [style*="color: #AAAAAA"] { color: #777 !important; }
    body.dark-mode input, body.dark-mode textarea, body.dark-mode select { background: #2a2a2a !important; color: #e0e0e0 !important; border-color: #3a3a3a !important; }
    body.dark-mode button { color: inherit; }
    body.dark-mode nav { background: #222 !important; border-color: #3a3a3a !important; }

    /* Hoog contrast */
    body.hoog-contrast { filter: contrast(1.4); }

    /* Print */
    @media print {
      nav, button, .no-print { display: none !important; }
      body { background: white !important; color: black !important; font-size: 12pt !important; }
      div[style*="max-width: 420px"] { max-width: 100% !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Load order: data → components → sections → main app -->
  <script type="text/babel" src="data.js"></script>
  <script type="text/babel" src="nts-data.js"></script>
  <script type="text/babel" src="i18n.js"></script>
  <script type="text/babel" src="i18n-full.js"></script>
  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="melding.jsx"></script>
  <script type="text/babel" src="app-verzorgende.jsx"></script>
  <script type="text/babel" src="app-familie.jsx"></script>
  <script type="text/babel" src="app-eenvoudig.jsx"></script>
  <script type="text/babel" src="features.jsx"></script>
  <script type="text/babel" src="nts-wizard.jsx"></script>
  <script type="text/babel" src="caretaker-light.jsx"></script>
  <script type="text/babel" src="caretaker-portal.jsx"></script>
</body>
</html>
